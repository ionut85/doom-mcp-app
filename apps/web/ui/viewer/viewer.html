<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>DOOM</title>
    <link rel="stylesheet" href="./src/viewer.css" />
  </head>
  <body>
    <main class="app" id="app" data-mode="watch">
      <header class="top">
        <div class="title">
          <span class="dot" aria-hidden="true"></span>
          <strong>DOOM</strong>
          <span class="muted" id="mapinfo">waiting for a game</span>
        </div>
        <div class="badges">
          <span class="badge mode" id="mode-badge">Claude is playing</span>
          <span class="badge" id="perception" hidden></span>
          <span class="badge" id="smooth-badge" hidden></span>
        </div>
      </header>

      <div class="stage" id="stage">
        <div class="screen" id="screen" tabindex="0" aria-label="DOOM game screen">
          <canvas id="canvas" width="320" height="200"></canvas>
          <div class="empty" id="empty">Starting the game…</div>
          <div class="sync" id="sync" hidden><span class="spinner" aria-hidden="true"></span><span id="sync-text">replaying…</span></div>
          <div class="banner" id="banner" hidden></div>
        </div>
        <div class="pad" id="pad" hidden>
          <p class="pad-hint">Drag left side to move · right side to turn</p>
          <div class="buttons">
            <button type="button" class="fire" id="t-fire">FIRE</button>
            <button type="button" id="t-use">USE</button>
            <button type="button" id="t-wpn">WPN</button>
          </div>
        </div>
      </div>

      <div class="hud" id="hud" hidden>
        <span><b id="h-health">100</b> health</span>
        <span><b id="h-armor">0</b> armor</span>
        <span><b id="h-weapon">pistol</b> <span id="h-ammo"></span></span>
        <span><b id="h-kills">0/0</b> kills</span>
        <span class="muted" id="h-time"></span>
      </div>

      <section class="captions" id="captions-wrap">
        <h2 id="captions-title">Claude's moves</h2>
        <ol id="captions"><li class="muted">No moves yet.</li></ol>
      </section>

      <div class="talk" id="talk" role="group" aria-label="Tell Claude" hidden>
        <input id="talk-text" type="text" maxlength="300" autocomplete="off" placeholder="Tell Claude what to do, e.g. go through the door on the left" aria-label="Message to Claude" />
        <button type="button" id="mic-btn" hidden aria-label="Speak to Claude" title="Speak">🎤</button>
        <button type="button" id="talk-send">Send</button>
      </div>
      <p class="talk-status muted" id="talk-status" hidden></p>

      <footer class="actions">
        <button type="button" class="primary" id="play-btn">Play yourself</button>
        <button type="button" id="watch-btn" hidden>Back to Claude's game</button>
        <button type="button" id="fullscreen-btn" hidden>Fullscreen</button>
        <label class="toggle"><input type="checkbox" id="smooth-toggle" checked /> Smooth playback</label>
        <span class="hint" id="hint"></span>
      </footer>

      <details class="diag"><summary>Diagnostics</summary><pre id="diag"></pre></details>
    </main>
    <script type="module" src="./src/viewer.ts"></script>
  </body>
</html>
